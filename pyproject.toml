[project]
name = "assessor"
version = "0.1.0"
description = "Assessor de investimentos de longo prazo para ações da B3"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assessor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
