# Advisor risk limits. Single source of truth for the numbers.
# The rationale for each limit is in docs/strategy/risk-limits.md.
# Change both files in the same commit (tests/test_risk_limits.py enforces it).
# Starting values, to be validated in the backtest.

portfolio:
  min_stocks: 15
  max_stocks: 20
  fixed_income_reserve_min: 0.10
  fixed_income_reserve_max: 0.15

position:
  max_weight_per_stock: 0.10
  max_weight_per_sector: 0.30

liquidity:
  min_avg_daily_volume_brl: 20_000_000
  volume_window_days: 63          # ~3 months of trading sessions
  min_market_cap_brl: 2_000_000_000
  max_sessions_to_exit: 5
  max_share_of_daily_volume: 0.20

volatility:
  max_annual_target: 0.25

drawdown:
  portfolio_stop: 0.20            # drop from peak
  exposure_cut_at_stop: 0.50
  requires_human_review: true

factors:
  max_exposure_domestic_rate_sensitive: 0.50
  reduce_before_elections: true

underperformance:
  points_below_ibovespa_12m: 0.10
  action: pause_buys_and_review

universe:
  allow_bdr: false
  allow_options: false
  allow_leverage: false
  max_net_debt_to_ebitda: 3.0     # banks excluded

execution:
  human_approval_required: true
  order_type: limit
